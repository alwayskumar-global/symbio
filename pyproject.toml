[project]
name = "symbio"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["relate-db==1.0.0", "ortools==9.15.6755", "fastapi", "uvicorn", "pydantic>=2"]

[project.scripts]
symbio = "symbio.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
